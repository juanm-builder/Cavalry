appId: com.local.cavalry.mac
productName: Cavalry for Mac
protocols:
  - name: Cavalry URL
    schemes:
      - cavalry

directories:
  output: out/release/mac

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json

extraResources:
  - from: ../../LICENSE
    to: licenses/Cavalry-LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: packaging/RUNTIME-DEPENDENCY-LICENSES.txt
    to: licenses/RUNTIME-DEPENDENCY-LICENSES.txt
  - from: ../../node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE.txt
  - from: ../../node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html

electronUpdaterCompatibility: '>= 2.16'
forceCodeSigning: true

mac:
  artifactName: Cavalry-for-Mac-${version}-${arch}.${ext}
  category: public.app-category.finance
  hardenedRuntime: true
  notarize: true
  icon: packaging/Cavalry.icns
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: Cavalry for Mac
    CFBundleName: Cavalry for Mac
    CFBundleSpokenName: Cavalry
    NSMicrophoneUsageDescription: Cavalry uses the microphone only when you choose voice input to dictate a Companion chat message.
  target:
    - dmg
    - zip

dmg:
  sign: true

publish:
  provider: generic
  url: https://github.com/${env.GITHUB_REPOSITORY}/releases/latest/download
  channel: latest
