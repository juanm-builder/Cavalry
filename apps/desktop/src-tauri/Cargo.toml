[package]
name = "cavalry-desktop"
version = "2.2.9"
description = "Cavalry local-first desktop finance app"
authors = ["Cavalry"]
license = "Apache-2.0"
repository = "https://github.com/juanm-builder/Cavalry"
edition = "2021"
publish = false

[lib]
name = "cavalry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cavalry"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
tauri-plugin-updater = "=2.11.0"
tauri-plugin-window-state = "=2.4.1"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
