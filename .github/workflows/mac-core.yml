name: Mac Core

on:
  pull_request:
    paths:
      - '.github/**'
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'vitest.config.mjs'
      - 'LICENSE'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'vitest.config.mjs'
      - 'LICENSE'

concurrency:
  group: mac-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core validation
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Architecture report
        run: node tools/repo/architecture-report.mjs

      - name: Workspace checks
        run: npm run check

      - name: Electron DOM smoke
        run: npm run test:e2e

      - name: Whitespace check
        run: git diff --check
