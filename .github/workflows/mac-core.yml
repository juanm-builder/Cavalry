name: Mac Core

on:
  pull_request:
    paths:
      - '.github/**'
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'vitest.config.mjs'
      - 'LICENSE'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'vitest.config.mjs'
      - 'LICENSE'

concurrency:
  group: mac-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core validation
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Architecture report
        run: node tools/repo/architecture-report.mjs

      - name: Workspace checks
        run: npm run check

      - name: Electron DOM smoke
        run: npm run test:e2e

      - name: Whitespace check
        run: git diff --check
