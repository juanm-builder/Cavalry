name: Mac Full

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mac-full.yml'
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'supabase/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: mac-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CAVALRY_SUPABASE_URL: ${{ vars.CAVALRY_SUPABASE_URL }}
  CAVALRY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CAVALRY_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  security:
    name: Security preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Run release security checks
        run: npm run release:security

  full:
    name: Full validation and package (${{ matrix.display_name }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Apple silicon
            runner: macos-latest
            package_command: npm run package:mac
            app_directory: mac-arm64
            binary_architecture: arm64
            artifact_architecture: arm64
          - display_name: Intel
            runner: macos-15-intel
            package_command: npm run package:mac:intel
            app_directory: mac
            binary_architecture: x86_64
            artifact_architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Workspace checks
        run: npm run check

      - name: Electron end-to-end smoke
        run: npm run test:e2e

      - name: Build macOS package
        run: ${{ matrix.package_command }}

      - name: Validate packaged app architecture and launch
        shell: bash
        run: |
          set -euo pipefail
          app_path="apps/mac/out/package/${{ matrix.app_directory }}/Cavalry for Mac.app"
          executable="$app_path/Contents/MacOS/Cavalry for Mac"
          log_path="$RUNNER_TEMP/cavalry-packaged-app.log"
          expected_arch="${{ matrix.binary_architecture }}"
          test -d "$app_path"
          test -x "$executable"
          mach_o_count=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              actual_arch="$(lipo -archs "$candidate")"
              if [[ "$actual_arch" != "$expected_arch" ]]; then
                echo "Expected $expected_arch but found $actual_arch in $candidate"
                exit 1
              fi
              ((mach_o_count += 1))
            fi
          done < <(find "$app_path" -type f -print0)
          test "$mach_o_count" -gt 0
          codesign --verify --deep --strict "$app_path"
          "$executable" >"$log_path" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$log_path"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cavalry-mac-${{ matrix.artifact_architecture }}-${{ github.sha }}
          path: apps/mac/out/package/*-${{ matrix.artifact_architecture }}.dmg
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
