name: Desktop Release

on:
  push:
    tags: ['v*']

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable release input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate versions, security, and tests
        run: |
          node tools/release/validate-release.mjs "$GITHUB_REF_NAME"
          npm run release:security
          npm run licenses:runtime
          npm run check
          npm run test:integration
          npm run test:e2e
          git diff --check

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    environment: release-signing
    strategy:
      fail-fast: false
      # tauri-action merges latest.json with a read/delete/re-upload sequence. Serialize the
      # architectures so one job cannot overwrite the other job's updater platform entry.
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            host_arch: arm64
            asset_arch: aarch64
            target: aarch64-apple-darwin
            sidecar: sidecar:prepare:mac
          - label: macOS Intel
            runner: macos-15-intel
            host_arch: x86_64
            asset_arch: x64
            target: x86_64-apple-darwin
            sidecar: sidecar:prepare:mac:intel
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rust target and Tauri CLI
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Prepare signed updater configuration and sidecar
        shell: bash
        working-directory: apps/desktop
        env:
          CAVALRY_UPDATER_PUBLIC_KEY: ${{ secrets.CAVALRY_UPDATER_PUBLIC_KEY }}
        run: |
          npm run licenses:runtime
          npm run build:host
          npm run "${{ matrix.sidecar }}"
          npm run release:config
          echo "$GITHUB_WORKSPACE/apps/desktop/scripts/macos-codesign-shim" >> "$GITHUB_PATH"

      - name: Prepare Apple release credentials
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "::error::The App Store Connect API key, key ID, and issuer are required for provisioning and notarization."
            exit 1
          fi
          if [ -z "${MAC_CSC_LINK:-}" ] || [ -z "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::The Developer ID certificate and its password are required."
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"

          certificate_bundle="$RUNNER_TEMP/CavalryDeveloperID.p12"
          certificate_pem="$RUNNER_TEMP/CavalryDeveloperID.pem"
          printf '%s' "$MAC_CSC_LINK" | tr -d '\r\n ' | openssl base64 -d -A -out "$certificate_bundle"
          chmod 600 "$certificate_bundle"
          openssl pkcs12 -in "$certificate_bundle" -clcerts -nokeys \
            -passin env:MAC_CSC_KEY_PASSWORD -out "$certificate_pem"
          certificate_serial="$(openssl x509 -in "$certificate_pem" -noout -serial | sed -E 's/^serial=//I')"
          if [[ ! "$certificate_serial" =~ ^[0-9A-Fa-f]+$ ]]; then
            echo "::error::Could not read the Developer ID certificate serial number."
            exit 1
          fi

          # Tauri reads APPLE_API_KEY as the key *ID* and APPLE_API_KEY_PATH as the .p8 path.
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_CERTIFICATE_SERIAL=$certificate_serial" >> "$GITHUB_ENV"

      - name: Prepare CloudKit provisioning profile
        shell: bash
        env:
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_CERTIFICATE_SERIAL: ${{ env.APPLE_SIGNING_CERTIFICATE_SERIAL }}
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile_path="apps/desktop/src-tauri/Cavalry.provisionprofile"
          if [ -n "${MAC_PROVISIONING_PROFILE_BASE64:-}" ]; then
            printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$profile_path"
            chmod 600 "$profile_path"
            echo "Using the encrypted Developer ID provisioning profile."
          else
            node tools/release/prepare-mac-profile.mjs --output "$profile_path"
          fi
          profile_plist="$RUNNER_TEMP/cavalry-provisioning-profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          application_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          if [[ "$application_id" != *.com.juanmbuilder.cavalry.mac ]]; then
            echo "::error::The provisioning profile targets $application_id instead of com.juanmbuilder.cavalry.mac."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null | grep -Fqx 'true'; then
            echo "::error::A development provisioning profile cannot be used for a Developer ID release."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" | grep -Fqx 'true'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$profile_plist" | grep -Fq 'iCloud.com.juanmbuilder.cavalry'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-environment' "$profile_plist" | grep -Fq 'Production'
          # Xcode-generated Developer ID profiles authorize the registered iCloud services with
          # `*`; API-generated profiles may enumerate `CloudKit`. The app's signed entitlements
          # are checked below and must still request CloudKit explicitly.
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-services' "$profile_plist" | grep -Eq 'CloudKit|^[[:space:]]*\*[[:space:]]*$'

      - name: Build, sign, and upload Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Cavalry ${{ github.ref_name }}
          releaseBody: |
            Signed Cavalry desktop release for macOS. Review both architectures, installers, updater assets, and notarization evidence before publishing.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Cavalry.for.Mac_[version]_[arch][ext]
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Smoke test the signed host sidecar
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -print -quit)"
          sidecar="$app_path/Contents/MacOS/cavalry-host"
          if [ ! -x "$sidecar" ]; then
            echo "::error::No cavalry-host sidecar found at $sidecar"
            exit 1
          fi
          # The sidecar embeds Node, and the hardened runtime kills V8 at startup unless the JIT
          # entitlements are present. That failure is invisible to codesign and to notarization, so
          # the only way to catch it is to actually run the signed binary and wait for its handshake.
          actual_host="$(uname -m)"
          if [ "$actual_host" != "${{ matrix.host_arch }}" ]; then
            echo "::error::Expected host ${{ matrix.host_arch }}, got $actual_host"
            exit 1
          fi
          if ! lipo -archs "$sidecar" | tr ' ' '\n' | grep -qx "${{ matrix.host_arch }}"; then
            echo "::error::Sidecar architectures $(lipo -archs "$sidecar") do not contain ${{ matrix.host_arch }}"
            exit 1
          fi
          node apps/desktop/scripts/sidecar-smoke.mjs \
            --binary "$sidecar" \
            --expect-icloud-enabled
          # Exercise the signed architecture's real bundled persistence and IPC
          # through forced process death, relaunch, and clearing only selection.
          node apps/desktop/scripts/workbook-recovery-smoke.mjs --binary "$sidecar"

      - name: Notarize and staple the DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmgs=("$bundle_dir"/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No DMG produced under $bundle_dir/dmg"
            exit 1
          fi
          # Tauri notarizes and staples the .app only; the DMG it builds is signed but not notarized.
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::No .app bundle found under $bundle_dir/macos"
            exit 1
          fi
          sidecar="$app_path/Contents/MacOS/cavalry-host"
          if [ ! -s "$app_path/Contents/embedded.provisionprofile" ]; then
            echo "::error::The signed app is missing its CloudKit provisioning profile."
            exit 1
          fi
          signed_entitlements="$RUNNER_TEMP/cavalry-signed-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$app_path" > "$signed_entitlements"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-environment' "$signed_entitlements")" = "Production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.aps-environment' "$signed_entitlements")" = "production"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers' "$signed_entitlements" | grep -Fq 'iCloud.com.juanmbuilder.cavalry'
          sidecar_entitlements="$RUNNER_TEMP/cavalry-sidecar-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$sidecar" > "$sidecar_entitlements"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$sidecar_entitlements")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-unsigned-executable-memory' "$sidecar_entitlements")" = "true"
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers' "$sidecar_entitlements" >/dev/null 2>&1; then
            echo "::error::The host sidecar must not carry the app-only CloudKit entitlement."
            exit 1
          fi
          echo "== $app_path =="
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            echo "== $dmg =="
            /usr/bin/codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Upload stapled DMG over the draft release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            version="${GITHUB_REF_NAME#v}"
            release_dmg="$RUNNER_TEMP/Cavalry.for.Mac_${version}_${{ matrix.asset_arch }}.dmg"
            cp "$dmg" "$release_dmg"
            gh release upload "${{ github.ref_name }}" "$release_dmg" --clobber --repo "$GITHUB_REPOSITORY"
          done

  verify-release-assets:
    name: Verify uploaded release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub omits draft releases from the REST release listing for a read-only job token.
    # This job does not mutate the draft, but it needs release-author visibility to inspect it.
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify uploaded draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/release/verify-release-assets.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
