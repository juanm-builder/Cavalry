name: Desktop Release

on:
  push:
    tags: ['v*']

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable release input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate versions, security, and tests
        env:
          CAVALRY_SUPABASE_URL: ${{ vars.CAVALRY_SUPABASE_URL }}
          CAVALRY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CAVALRY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node tools/release/validate-cloud-config.mjs
          node tools/release/validate-release.mjs "$GITHUB_REF_NAME"
          npm run release:security
          npm run licenses:runtime
          npm run check
          npm run test:integration
          npm run test:e2e
          git diff --check

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    environment: release-signing
    env:
      CAVALRY_SUPABASE_URL: ${{ vars.CAVALRY_SUPABASE_URL }}
      CAVALRY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CAVALRY_SUPABASE_PUBLISHABLE_KEY }}
    strategy:
      fail-fast: false
      # tauri-action merges latest.json with a read/delete/re-upload sequence. Serialize the
      # architectures so one job cannot overwrite the other job's updater platform entry.
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            host_arch: arm64
            asset_arch: aarch64
            target: aarch64-apple-darwin
            sidecar: sidecar:prepare:mac
          - label: macOS Intel
            runner: macos-15-intel
            host_arch: x86_64
            asset_arch: x64
            target: x86_64-apple-darwin
            sidecar: sidecar:prepare:mac:intel
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rust target and Tauri CLI
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Prepare signed updater configuration and sidecar
        shell: bash
        working-directory: apps/desktop
        env:
          CAVALRY_UPDATER_PUBLIC_KEY: ${{ secrets.CAVALRY_UPDATER_PUBLIC_KEY }}
        run: |
          npm run licenses:runtime
          npm run build:host
          npm run "${{ matrix.sidecar }}"
          node ../../tools/release/validate-cloud-config.mjs --bundle dist/host/index.cjs
          npm run release:config

      - name: Prepare Apple API key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 and APPLE_API_KEY_ID must be set; notarization cannot run without them."
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"
          # Tauri reads APPLE_API_KEY as the key *ID* and APPLE_API_KEY_PATH as the .p8 path.
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and upload Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Cavalry ${{ github.ref_name }}
          releaseBody: |
            Signed Cavalry desktop release for macOS. Review both architectures, installers, updater assets, and notarization evidence before publishing.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Cavalry.for.Mac_[version]_[arch][ext]
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Smoke test the signed host sidecar
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -print -quit)"
          sidecar="$app_path/Contents/MacOS/cavalry-host"
          if [ ! -x "$sidecar" ]; then
            echo "::error::No cavalry-host sidecar found at $sidecar"
            exit 1
          fi
          # The sidecar embeds Node, and the hardened runtime kills V8 at startup unless the JIT
          # entitlements are present. That failure is invisible to codesign and to notarization, so
          # the only way to catch it is to actually run the signed binary and wait for its handshake.
          actual_host="$(uname -m)"
          if [ "$actual_host" != "${{ matrix.host_arch }}" ]; then
            echo "::error::Expected host ${{ matrix.host_arch }}, got $actual_host"
            exit 1
          fi
          if ! lipo -archs "$sidecar" | tr ' ' '\n' | grep -qx "${{ matrix.host_arch }}"; then
            echo "::error::Sidecar architectures $(lipo -archs "$sidecar") do not contain ${{ matrix.host_arch }}"
            exit 1
          fi
          node apps/desktop/scripts/sidecar-smoke.mjs \
            --binary "$sidecar" \
            --expect-cloud-configured

      - name: Notarize and staple the DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmgs=("$bundle_dir"/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No DMG produced under $bundle_dir/dmg"
            exit 1
          fi
          # Tauri notarizes and staples the .app only; the DMG it builds is signed but not notarized.
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::No .app bundle found under $bundle_dir/macos"
            exit 1
          fi
          echo "== $app_path =="
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            echo "== $dmg =="
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Upload stapled DMG over the draft release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            version="${GITHUB_REF_NAME#v}"
            release_dmg="$RUNNER_TEMP/Cavalry.for.Mac_${version}_${{ matrix.asset_arch }}.dmg"
            cp "$dmg" "$release_dmg"
            gh release upload "${{ github.ref_name }}" "$release_dmg" --clobber --repo "$GITHUB_REPOSITORY"
          done

  verify-release-assets:
    name: Verify uploaded release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub omits draft releases from the REST release listing for a read-only job token.
    # This job does not mutate the draft, but it needs release-author visibility to inspect it.
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Verify uploaded draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/release/verify-release-assets.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
