name: Desktop Release

on:
  push:
    tags: ['v*']

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable release input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate versions, security, and tests
        env:
          CAVALRY_SUPABASE_URL: ${{ vars.CAVALRY_SUPABASE_URL }}
          CAVALRY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CAVALRY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node tools/release/validate-cloud-config.mjs
          node tools/release/validate-release.mjs "$GITHUB_REF_NAME"
          npm run release:security
          npm run licenses:runtime
          npm run check
          npm run test:integration
          npm run test:e2e
          git diff --check

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            sidecar: sidecar:prepare:mac
          - label: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            sidecar: sidecar:prepare:mac:intel
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rust target and Tauri CLI
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Prepare signed updater configuration and sidecar
        shell: bash
        working-directory: apps/desktop
        env:
          CAVALRY_UPDATER_PUBLIC_KEY: ${{ secrets.CAVALRY_UPDATER_PUBLIC_KEY }}
        run: |
          npm run licenses:runtime
          npm run build:host
          npm run "${{ matrix.sidecar }}"
          npm run release:config

      - name: Prepare Apple API key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and upload Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Cavalry ${{ github.ref_name }}
          releaseBody: |
            Signed Cavalry desktop release for macOS. Review both architectures, installers, updater assets, and notarization evidence before publishing.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
