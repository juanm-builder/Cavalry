name: Desktop Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CAVALRY_SUPABASE_URL: ${{ vars.CAVALRY_SUPABASE_URL }}
  CAVALRY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CAVALRY_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  validate:
    name: Validate release tag and workspace
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Validate release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/release/validate-cloud-config.mjs
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          archived="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.archived')"
          if [[ "$visibility" != 'public' || "$archived" != 'false' ]]; then
            echo 'Desktop releases must run from the active public Cavalry repository.' >&2
            exit 1
          fi
          published_tags_path="$RUNNER_TEMP/cavalry-published-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$published_tags_path"
          set -- "$GITHUB_REF_NAME"
          while IFS= read -r published_tag; do
            [[ -n "$published_tag" ]] && set -- "$@" "$published_tag"
          done < "$published_tags_path"
          node tools/release/validate-release.mjs "$@"

      - name: Install workspace dependencies
        run: npm ci

      - name: Run workspace release gates
        run: |
          npm run release:security
          npm run check
          npm run test:integration
          npm run test:e2e

      - name: Whitespace check
        run: git diff --check

  build-macos:
    name: Build signed and notarized macOS release
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release-signing
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '\r\n ' | openssl base64 -d -A -out "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize both macOS architectures
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run package:release:mac

      - name: Sign, notarize, and staple the disk images
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node apps/mac/scripts/finalize-release-dmgs.mjs \
            apps/mac/out/release/mac \
            "$GITHUB_REF_NAME"

      - name: Verify macOS signatures, notarization, architectures, and disk images
        shell: bash
        run: |
          set -euo pipefail
          verify_app() {
            local app_path="$1"
            local expected_arch="$2"
            local mach_o_count=0
            test -d "$app_path"
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q 'Mach-O'; then
                actual_arch="$(lipo -archs "$candidate")"
                if [[ "$actual_arch" != "$expected_arch" ]]; then
                  echo "Expected $expected_arch but found $actual_arch in $candidate" >&2
                  exit 1
                fi
                ((mach_o_count += 1))
              fi
            done < <(find "$app_path" -type f -print0)
            test "$mach_o_count" -gt 0
            node_modules/.bin/asar list "$app_path/Contents/Resources/app.asar" \
              | grep -Fx '/node_modules/electron-updater/out/main.js' >/dev/null
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose "$app_path"
            xcrun stapler validate "$app_path"
          }
          verify_dmg() {
            local dmg_path="$1"
            test -s "$dmg_path"
            hdiutil verify "$dmg_path"
            codesign --verify --strict --verbose=2 "$dmg_path"
            codesign -dv --verbose=4 "$dmg_path" 2>&1 \
              | grep -F 'Authority=Developer ID Application:'
            codesign -dv --verbose=4 "$dmg_path" 2>&1 \
              | grep -F 'Timestamp='
            spctl --assess \
              --type open \
              --context context:primary-signature \
              --verbose=4 \
              "$dmg_path"
            xcrun stapler validate "$dmg_path"
          }
          verify_app 'apps/mac/out/release/mac/mac-arm64/Cavalry for Mac.app' arm64
          verify_app 'apps/mac/out/release/mac/mac/Cavalry for Mac.app' x86_64
          verify_dmg "apps/mac/out/release/mac/Cavalry-for-Mac-${GITHUB_REF_NAME#v}-arm64.dmg"
          verify_dmg "apps/mac/out/release/mac/Cavalry-for-Mac-${GITHUB_REF_NAME#v}-x64.dmg"
          test -s "apps/mac/out/release/mac/Cavalry-for-Mac-${GITHUB_REF_NAME#v}-arm64.zip"
          test -s "apps/mac/out/release/mac/Cavalry-for-Mac-${GITHUB_REF_NAME#v}-x64.zip"
          test -s apps/mac/out/release/mac/latest-mac.yml
          node tools/release/verify-release-assets.mjs \
            apps/mac/out/release/mac \
            "$GITHUB_REF_NAME"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cavalry-release-macos-${{ github.ref_name }}
          path: |
            apps/mac/out/release/mac/*.dmg
            apps/mac/out/release/mac/*.zip
            apps/mac/out/release/mac/*.blockmap
            apps/mac/out/release/mac/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  prepare-draft:
    name: Prepare GitHub release draft
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publishing
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cavalry-release-macos-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Verify the complete update set
        run: |
          node tools/release/verify-release-assets.mjs release-assets "$GITHUB_REF_NAME"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Create or refresh the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repository="$GITHUB_REPOSITORY"
          release_state="$(gh release view "$tag" --repo "$repository" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          notes_path="$RUNNER_TEMP/cavalry-release-notes.md"
          cat > "$notes_path" <<EOF
          Cavalry $tag desktop update for macOS (Apple silicon and Intel).

          Source revision: $GITHUB_SHA

          Review both DMGs, the macOS update metadata, blockmaps, and SHA256SUMS.txt before publishing this draft. Installed apps cannot see draft releases.
          EOF
          if [[ -z "$release_state" ]]; then
            gh release create "$tag" \
              --repo "$repository" \
              --verify-tag \
              --title "Cavalry $tag" \
              --notes-file "$notes_path" \
              --draft
          elif [[ "$release_state" != 'true' ]]; then
            echo "Release $tag is already published; refusing to replace visible update assets." >&2
            exit 1
          else
            gh release edit "$tag" \
              --repo "$repository" \
              --title "Cavalry $tag" \
              --notes-file "$notes_path"
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$tag" "${assets[@]}" --repo "$repository" --clobber
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/local-assets.txt"
          gh release view "$tag" --repo "$repository" --json assets --jq '.assets[].name' \
            | sort > "$RUNNER_TEMP/remote-assets.txt"
          comm -23 "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt" \
            > "$RUNNER_TEMP/missing-assets.txt"
          if [[ -s "$RUNNER_TEMP/missing-assets.txt" ]]; then
            echo 'Draft release is missing expected assets:' >&2
            cat "$RUNNER_TEMP/missing-assets.txt" >&2
            exit 1
          fi
          {
            echo "### Draft release ready"
            echo
            echo "Review and manually publish \`$repository@$tag\`. Until then, installed apps cannot see it."
          } >> "$GITHUB_STEP_SUMMARY"
