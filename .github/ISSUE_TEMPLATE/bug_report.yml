name: Bug report
description: Report a reproducible problem in Cavalry
title: '[Bug]: '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Cavalry. Remove personal financial data, account details, tokens, and local file paths before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed sensitive and personally identifying information from this report and its attachments.
          required: true

  - type: input
    id: version
    attributes:
      label: Cavalry version
      description: Find this in the app's About window.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other development environment
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add redacted screenshots or logs only when they help reproduce the issue.
